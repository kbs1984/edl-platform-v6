<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDL Platform v6 - Progress Matrix Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 24px 32px;
            margin-bottom: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            color: #2d3748;
            font-size: 32px;
            margin-bottom: 8px;
        }
        
        .header .subtitle {
            color: #718096;
            font-size: 16px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        .stat-card .value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .stat-card .label {
            color: #718096;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .stat-card.p0 .value { color: #e53e3e; }
        .stat-card.p1 .value { color: #f6ad55; }
        .stat-card.p2 .value { color: #4299e1; }
        .stat-card.health .value { color: #48bb78; }
        
        .filters {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        
        .filter-btn:hover {
            border-color: #667eea;
            background: #f7fafc;
        }
        
        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .matrix-container {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        
        .feature-grid {
            display: grid;
            gap: 12px;
        }
        
        .feature-card {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 16px;
            align-items: center;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .feature-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            border-color: #cbd5e0;
        }
        
        .feature-card.validated {
            background: linear-gradient(135deg, #48bb7833 0%, #38a16933 100%);
            border-color: #48bb78;
        }
        
        .feature-card.implemented {
            background: linear-gradient(135deg, #4299e133 0%, #3182ce33 100%);
            border-color: #4299e1;
        }
        
        .feature-card.in_progress {
            background: linear-gradient(135deg, #f6ad5533 0%, #ed8b1633 100%);
            border-color: #f6ad55;
        }
        
        .feature-card.not_started {
            background: #f7fafc;
            border-color: #e2e8f0;
        }
        
        .priority-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .priority-badge.P0 {
            background: #fed7d7;
            color: #c53030;
        }
        
        .priority-badge.P1 {
            background: #feebc8;
            color: #c05621;
        }
        
        .priority-badge.P2 {
            background: #bee3f8;
            color: #2c5282;
        }
        
        .feature-info {
            flex: 1;
        }
        
        .feature-name {
            font-weight: 600;
            font-size: 16px;
            color: #2d3748;
            margin-bottom: 4px;
        }
        
        .feature-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        
        .meta-tag {
            font-size: 12px;
            color: #718096;
            background: white;
            padding: 2px 8px;
            border-radius: 4px;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .status-dot.validated { background: #48bb78; }
        .status-dot.implemented { background: #4299e1; }
        .status-dot.in_progress { background: #f6ad55; }
        .status-dot.not_started { background: #cbd5e0; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .status-text {
            font-size: 14px;
            color: #4a5568;
            text-transform: capitalize;
        }
        
        .legend {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin-top: 24px;
            padding: 16px;
            background: rgba(255,255,255,0.9);
            border-radius: 12px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #4a5568;
        }
        
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }
        
        .category-header {
            font-size: 18px;
            font-weight: bold;
            color: #2d3748;
            margin: 20px 0 12px 0;
            padding: 8px 0;
            border-bottom: 2px solid #e2e8f0;
            text-transform: capitalize;
        }
        
        .health-badge {
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .syndrome-warning {
            background: #fed7d7;
            color: #c53030;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 8px;
        }
    </style>
</head>

        ];
        
        // Parse database_tables if they're strings
        features.forEach(f => {
            if (typeof f.database_tables === 'string') {
                try {
                    f.database_tables = JSON.parse(f.database_tables);
                } catch(e) {
                    // Handle object format
                    if (f.database_tables.startsWith('{')) {
                        f.database_tables = Object.keys(JSON.parse(f.database_tables.replace(/'/g, '"')));
                    } else {
                        f.database_tables = [];
                    }
                }
            }
            if (typeof f.ui_components === 'string') {
                try {
                    f.ui_components = JSON.parse(f.ui_components);
                } catch(e) {
                    f.ui_components = [];
                }
            }
        });
        
        function calculateStats() {
            const stats = {
                total: features.length,
                validated: features.filter(f => f.status === 'validated').length,
                implemented: features.filter(f => f.status === 'implemented').length,
                in_progress: features.filter(f => f.status === 'in_progress').length,
                not_started: features.filter(f => f.status === 'not_started').length,
                p0: features.filter(f => f.priority === 'P0').length,
                p1: features.filter(f => f.priority === 'P1').length,
                p2: features.filter(f => f.priority === 'P2').length,
                health: Math.round(features.filter(f => f.reality_health).reduce((sum, f) => sum + parseFloat(f.reality_health || 0), 0) / features.filter(f => f.reality_health).length || 0)
            };
            
            const completion = Math.round(((stats.validated + stats.implemented) / stats.total) * 100);
            
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card">
                    <div class="value">${stats.total}</div>
                    <div class="label">Total Features</div>
                </div>
                <div class="stat-card">
                    <div class="value">${completion}%</div>
                    <div class="label">Complete</div>
                </div>
                <div class="stat-card p0">
                    <div class="value">${stats.p0}</div>
                    <div class="label">P0 Critical</div>
                </div>
                <div class="stat-card p1">
                    <div class="value">${stats.p1}</div>
                    <div class="label">P1 Priority</div>
                </div>
                <div class="stat-card p2">
                    <div class="value">${stats.p2}</div>
                    <div class="label">P2 Future</div>
                </div>
                <div class="stat-card health">
                    <div class="value">${stats.health}%</div>
                    <div class="label">Reality Health</div>
                </div>
            `;
        }
        
        function renderFeatures(filterType = 'all') {
            let filtered = features;
            
            if (filterType !== 'all') {
                if (['P0', 'P1', 'P2'].includes(filterType)) {
                    filtered = features.filter(f => f.priority === filterType);
                } else {
                    filtered = features.filter(f => f.status === filterType);
                }
            }
            
            // Group by category
            const grouped = {};
            filtered.forEach(f => {
                if (!grouped[f.feature_category]) {
                    grouped[f.feature_category] = [];
                }
                grouped[f.feature_category].push(f);
            });
            
            let html = '';
            Object.keys(grouped).sort().forEach(category => {
                html += `<div class="category-header">${category}</div>`;
                grouped[category].forEach(feature => {
                    const tablesCount = feature.database_tables?.length || 0;
                    const uiCount = feature.ui_components?.length || 0;
                    
                    html += `
                        <div class="feature-card ${feature.status}">
                            <div class="priority-badge ${feature.priority}">${feature.priority}</div>
                            <div class="feature-info">
                                <div class="feature-name">
                                    ${feature.feature_name}
                                    ${feature.ninety_five_syndrome ? '<span class="syndrome-warning">95% Syndrome</span>' : ''}
                                </div>
                                <div class="feature-meta">
                                    ${feature.canvas_id ? `<span class="meta-tag">📋 ${feature.canvas_id}</span>` : ''}
                                    ${feature.user_story ? `<span class="meta-tag">📝 ${feature.user_story}</span>` : ''}
                                    ${tablesCount > 0 ? `<span class="meta-tag">🗄️ ${tablesCount} tables</span>` : ''}
                                    ${uiCount > 0 ? `<span class="meta-tag">🎨 ${uiCount} components</span>` : ''}
                                    ${feature.reality_health ? `<span class="health-badge">${feature.reality_health}%</span>` : ''}
                                </div>
                            </div>
                            <div class="status-indicator">
                                <div class="status-dot ${feature.status}"></div>
                                <span class="status-text">${feature.status.replace('_', ' ')}</span>
                            </div>
                        </div>
                    `;
                });
            });
            
            document.getElementById('featureGrid').innerHTML = html;
        }
        
        function filterFeatures(type) {
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderFeatures(type);
        }
        
        // Initialize
        calculateStats();
        renderFeatures();
    </script>
</body>
</html>
